# Atualizacao automatica de dependencias: uma vez por semana (segunda, 06:00 em
# Sao Paulo), com patch e minor de cada ecossistema agrupados num PR so. Major
# abre PR proprio, para ser lido com o changelog.
#
# O limite de 3 PRs abertos vale ate o congelamento do codigo em 06/11/2026.
# Depois dele, trocar `open-pull-requests-limit` por 0 nos tres blocos (e o 3
# do teste em tests/unitarios/test_scripts_ci.py): o 0 desliga so as
# atualizacoes de versao; os PRs de seguranca do Dependabot (habilitados no
# repositorio) nao entram no limite e seguem abrindo.
#
# Sem `labels`: os PRs levam os rotulos padrao do Dependabot (`dependencies` e o
# do ecossistema), que ele cria no repositorio se faltarem. Com `labels`
# explicito, rotulo que nao existe no repositorio e ignorado, e o Dependabot
# comenta isso em cada PR.
#
# O que o Dependabot nao cobre e a versao ficou fixada de proposito, a ser
# subida a mao: mongo e percona/mongodb_exporter em k8s/ (docs/implantacao.md),
# mongo e rabbitmq do compose e dos testes de integracao, o SonarQube do ci.yml
# e o scanner de scripts/sonar, o trivy, o kubeconform, o pip-audit e o
# diff-cover (Makefile e workflows) e o gitleaks (security.yml).
version: 2

updates:
  # pyproject.toml e uv.lock (o CI exige `uv lock --check` e `--frozen`).
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "America/Sao_Paulo"
    open-pull-requests-limit: 3
    commit-message:
      prefix: "chore(deps)"
    groups:
      # Leva tambem os opentelemetry-*: o SDK fixa opentelemetry-api e
      # semantic-conventions na mesma versao, e subir so uma parte nao
      # resolve, entao a familia sobe junta aqui. Um grupo so deles ficaria
      # vazio, mesmo antes deste no arquivo: o Dependabot o trata como menos
      # especifico que este. Pelo grupo so sobe patch (o `ignore` abaixo tira a
      # minor e a major): telemetria.py troca _status e _events de um span,
      # atributos privados do SDK que uma minor nova pode mudar.
      python-patch-e-minor:
        update-types: ["minor", "patch"]
    # O teto do pyproject.toml (<1.46 e <0.67) nao segura o Dependabot: ele o
    # alarga (no OS e na Execucao o sqlalchemy <2.1 virou <2.2, trouxe a 2.1 e
    # quebrou o build). Minor nova dos opentelemetry-* so entra a mao, com os
    # dois tetos subidos juntos, depois de ler o changelog.
    ignore:
      - dependency-name: "opentelemetry-*"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      # Segurado ate a entrega da fase 4 (17/11/2026); reavaliar depois. O
      # FastAPI e 0.x e traz mudanca incompativel em minor: 8 das 13 minors
      # entre a 0.144 e a 0.156 tem Breaking Changes nas notas de release (a
      # 0.151 passou a distinguir null de campo omitido no corpo JSON), e os
      # tres servicos ficam na mesma versao ate la. O patch segue pelo grupo,
      # e o pydantic nao entra aqui: a minor dele segue pelo grupo e pelo CI.
      - dependency-name: "fastapi"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]

  # Actions dos workflows (por tag, ou por SHA com a versao no comentario).
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "America/Sao_Paulo"
    open-pull-requests-limit: 3
    commit-message:
      prefix: "ci"
    groups:
      actions-patch-e-minor:
        update-types: ["minor", "patch"]

  # Imagens das linhas FROM do Dockerfile: o uv do estagio builder
  # (ghcr.io/astral-sh/uv) e o python do runtime. O Dependabot so le linhas
  # FROM; um `COPY --from=<imagem>` ficaria de fora.
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "America/Sao_Paulo"
    open-pull-requests-limit: 3
    commit-message:
      prefix: "chore(deps)"
    groups:
      docker-patch-e-minor:
        update-types: ["minor", "patch"]
    # O Python sobe a mao, de uma vez em .python-version, UV_PYTHON e
    # python-version dos workflows, requires-python e python_version (mypy) do
    # pyproject, sonar.python.version do sonar-project.properties e nas duas
    # imagens do Dockerfile: o venv do builder tem de rodar no Python do runtime.
    # Sem isto o 3.14 -> 3.15 chegaria como "minor", dentro do grupo acima, e
    # trocaria so a imagem do runtime. O patch vem do rebuild da tag movel do
    # runtime (python:3.14-slim-trixie), sem PR.
    ignore:
      - dependency-name: "python"
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"
