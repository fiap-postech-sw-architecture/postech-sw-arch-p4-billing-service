# Mutantes manuais dos modulos criticos (scripts/mutacao_manual.py, make mutacao).
#
# Cada [[mutante]] troca o trecho `de` (uma ocorrencia exata no arquivo) por
# `para` e roda so os testes do grupo `testes`; o teste esperado e o que deveria
# pegar o defeito. `equivalente` marca o mutante que nao muda o resultado e diz
# em que condicao isso vale: se sobreviver, nao conta contra a suite.

[config]
# O que o script copia do repositorio para mutants/ (arquivos e pastas): tudo
# que os testes dos grupos abaixo importam ou leem. Os testes de integracao do
# Billing sobem o MongoDB e o RabbitMQ por testcontainers (precisam de Docker);
# com TEST_MONGODB_URI apontando para um replica set no ar, poupam o container
# de cada mutante.
copiar = ["src", "tests", "contratos", "k8s", "pyproject.toml", ".coveragerc"]

[testes]
dinheiro = ["tests/unitarios/test_compartilhado_dominio.py"]
orcamento = ["tests/unitarios/test_orcamento_dominio.py"]
pagamento = ["tests/unitarios/test_pagamento_dominio.py", "tests/unitarios/test_historico.py"]
jwt = ["tests/unitarios/test_jwks.py", "tests/unitarios/test_autenticacao.py"]
mercadopago = ["tests/unitarios/test_mercadopago.py"]
consumidor = ["tests/integracao/test_consumidor.py"]
relay = ["tests/integracao/test_relay.py"]
outbox = ["tests/integracao/test_outbox.py", "tests/integracao/test_unit_of_work_e_repositorios.py"]
saga_pagamento = ["tests/integracao/test_casos_de_uso_pagamento.py", "tests/integracao/test_comandos_da_saga.py"]
saga_orcamento = ["tests/integracao/test_casos_de_uso_orcamento.py", "tests/integracao/test_comandos_da_saga.py"]


